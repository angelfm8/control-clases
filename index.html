<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control de clases</title>
<style>:root{--bg:#f3f6fa;--card:#fff;--ink:#1f2933;--muted:#6b7785;--line:#d9e0e7;--primary:#1f4e79;--primary-soft:#e4eef8;--ok:#2e7d32;--ok-soft:#e5f3e6;--danger:#c62828;--danger-soft:#fdeaea;--warn:#b26a00;--warn-soft:#fff1d6;--grey:#d9d9d9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,"Segoe UI",Arial,sans-serif}
header.top{background:var(--primary);color:#fff;display:flex;align-items:center;gap:16px;padding:0 20px;position:sticky;top:0;z-index:20;height:52px}
header.top h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap}
nav.tabs{display:flex;gap:2px;flex:1}
nav.tabs button{background:none;border:0;color:#cfe0f1;font:inherit;font-weight:600;padding:16px 14px;cursor:pointer;border-bottom:3px solid transparent}
nav.tabs button:hover{color:#fff}
nav.tabs button.on{color:#fff;border-bottom-color:#fff}
.estado{display:flex;align-items:center;gap:8px;font-size:12px}
.estado .pill{padding:3px 10px;border-radius:12px;background:rgba(255,255,255,.18);cursor:pointer;white-space:nowrap}
.estado .pill.warn{background:var(--warn-soft);color:var(--warn);font-weight:700}
.estado .pill.ok{background:rgba(255,255,255,.22)}
main#vista{padding:18px 20px 60px;max-width:1500px;margin:0 auto}
.banner{background:var(--warn-soft);color:#6b4500;border-bottom:1px solid #f0d28a;padding:9px 20px;display:flex;gap:12px;align-items:center}
h2{font-size:18px;margin:0 0 12px}h3{font-size:14px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:4px}
.grow{flex:1}
label.lbl{font-size:12px;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;border:1px solid #bcc7d3;border-radius:6px;padding:6px 8px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #8fb6dc;border-color:#5b8db8}
input[type=number]{width:90px}
.btn{font:inherit;font-weight:600;border:1px solid #bcc7d3;background:#fff;color:var(--ink);padding:7px 14px;border-radius:7px;cursor:pointer}
.btn:hover{background:#eef2f6}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.primary:hover{background:#17405f}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.ok:hover{background:#256628}
.btn.danger{background:#fff;color:var(--danger);border-color:#e6b0b0}.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
table.t{border-collapse:collapse;width:100%;background:#fff}
table.t th{background:#eaf0f6;text-align:left;font-size:12px;color:#33475b;padding:7px 9px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
table.t td{padding:6px 9px;border-bottom:1px solid #eef1f4;vertical-align:middle}
table.t tr:hover td{background:#fafcfe}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12px}.bold{font-weight:700}
.neg{color:var(--danger);font-weight:700}.pos{color:var(--ok);font-weight:700}
.chip{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600;background:var(--primary-soft);color:var(--primary)}
.chip.priv{background:var(--ok-soft);color:var(--ok)}
.seg{display:inline-flex;border:1px solid #bcc7d3;border-radius:7px;overflow:hidden}
.seg button{font:inherit;border:0;background:#fff;padding:5px 11px;cursor:pointer;border-right:1px solid #bcc7d3;color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button.on.asistio{background:var(--ok);color:#fff}
.seg button.on.aviso{background:#2f6fb0;color:#fff}
.seg button.on.sin{background:var(--danger);color:#fff}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.chk input{width:17px;height:17px}
.split{display:grid;grid-template-columns:minmax(230px,300px) 1fr minmax(260px,340px);gap:14px;align-items:start}
@media(max-width:1250px){.split{grid-template-columns:240px 1fr}.split .lista{grid-column:1/-1}}
.glist .item{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:#fff}
.glist .item:hover{background:#f3f8fd}
.glist .item.sel{background:var(--primary-soft);border-color:#8fb6dc;font-weight:700}
.glist .item.dis{opacity:.45;cursor:not-allowed}
.gblock{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden;background:#fff}
.gblock.anulada{opacity:.55}
.ghead{display:flex;align-items:center;gap:12px;background:var(--primary-soft);padding:8px 12px;font-weight:700}
.ghead.priv{background:var(--ok-soft)}
.alu{display:grid;grid-template-columns:minmax(150px,1fr) auto auto;gap:12px;align-items:center;padding:6px 12px;border-top:1px solid #eef1f4}
.alu .imp{font-size:12px;color:var(--muted);min-width:60px;text-align:right}
.plist .it{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid #eef1f4;cursor:pointer}
.plist .it:hover{background:#f3f8fd}.plist .it.sel{background:var(--warn-soft)}
.matrix{border-collapse:collapse;font-size:12px}
.matrix th,.matrix td{border:1px solid #e3e8ee;padding:2px 3px;text-align:center;min-width:26px;height:26px}
.matrix th.d{background:#1f4e79;color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);height:58px;padding:4px 2px;font-weight:600}
.matrix th.n,.matrix td.n{text-align:left;min-width:210px;position:sticky;left:0;background:#fff;z-index:1}
.matrix tr.gh td{background:#dde9f5;font-weight:700}.matrix tr.gh.priv td{background:#e0f0dd}
.matrix td.s{color:var(--danger);font-weight:700}.matrix td.a{color:#2f6fb0;font-weight:700}.matrix td.ok{color:var(--ok);font-weight:700}
.matrix td.nc{background:#ffc000!important}.matrix td.gr{background:#d9d9d9}
.modal-bg{position:fixed;inset:0;background:rgba(20,30,40,.45);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:12px;padding:20px;max-width:520px;width:92%;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal h3{font-size:16px}.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1f2933;color:#fff;padding:10px 18px;border-radius:9px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:80%}
.toast.err{background:var(--danger)}.toast.ok{background:var(--ok)}
.combo{position:relative;display:inline-block}
.combo .list{position:absolute;top:100%;left:0;min-width:100%;max-height:260px;overflow:auto;background:#fff;border:1px solid #8fb6dc;border-radius:7px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:50}
.combo .list div{padding:6px 10px;cursor:pointer;white-space:nowrap}.combo .list div.hi,.combo .list div:hover{background:var(--primary-soft)}
.subtabs{display:flex;gap:6px;margin-bottom:14px}.subtabs button{font:inherit;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:18px;padding:5px 14px;cursor:pointer}
.subtabs button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:150px}
.kpi .v{font-size:20px;font-weight:700}.kpi .l{font-size:12px;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}

@media(max-width:760px){
 header.top{height:auto;flex-wrap:wrap;padding:6px 10px;gap:6px}
 nav.tabs{order:3;flex:1 0 100%;overflow-x:auto}
 nav.tabs button{padding:10px 10px;white-space:nowrap}
 .split{grid-template-columns:1fr}
 .alu{grid-template-columns:1fr;gap:6px}
 table.t th{position:static}
}
</style>
</head>
<body>
<header class="top">
  <h1>Control de clases</h1>
  <nav class="tabs" id="tabs"></nav>
  <div class="estado" id="estado"></div>
</header>
<div id="banner"></div>
<main id="vista"></main>
<script>'use strict';
/* ===== NUCLEO: datos, utilidades, persistencia (sin DOM) ===== */
const ESTADO_TXT = { asistio: 'Asistió', aviso: 'Falta con aviso', sin: 'Falta sin aviso' };
const SIMB = { asistio: '✓', aviso: 'A', sin: 'S' };
const CURSOS_INI = ['1º ESO', '2º ESO', '3º ESO', '4º ESO', '1º Bach', '2º Bach'];
const ASIG_INI = ['Matemáticas', 'Matemáticas CCSS', 'Física y Química', 'Física', 'Química'];
const OFERTA_INI = {
  '1º ESO': ['Matemáticas'], '2º ESO': ['Matemáticas', 'Física y Química'], '3º ESO': ['Matemáticas', 'Física y Química'],
  '4º ESO': ['Matemáticas', 'Matemáticas CCSS', 'Física y Química'],
  '1º Bach': ['Matemáticas', 'Matemáticas CCSS', 'Física y Química'],
  '2º Bach': ['Matemáticas', 'Matemáticas CCSS', 'Física', 'Química'],
};
// [asignatura, curso, tipo, franja]
const GRUPOS_INI = [
  ['Matemáticas', '1º ESO', 'AMPA', 1], ['Matemáticas', '2º ESO', 'AMPA', 1],
  ['Matemáticas', '3º ESO', 'AMPA', 2], ['Matemáticas', '4º ESO', 'AMPA', 2],
  ['Física y Química', '2º ESO', 'AMPA', 3],
  ['Física y Química', '3º ESO', 'AMPA', 4], ['Física y Química', '4º ESO', 'AMPA', 4],
  ['Matemáticas CCSS', '1º Bach', 'AMPA', 5], ['Matemáticas', '1º Bach', 'AMPA', 5], ['Física y Química', '1º Bach', 'AMPA', 5],
  ['Matemáticas CCSS', '2º Bach', 'Privado', 6],
];
const TRIM_INI = [['26-27 T1', '2026-09-08', '2026-12-22'], ['26-27 T2', '2027-01-11', '2027-03-19'], ['26-27 T3', '2027-03-30', '2027-06-22']];

function seedData() {
  const d = {
    version: 1, seq: {}, cursos: [], asignaturas: [], oferta: [], alumnos: [], grupos: [], inscripciones: [],
    trimestres: [], ajustes: { tarifaAmpa: 15, precioAlumnoAmpa: 3, privIndividual: 7, privGrupo: 5 },
    partes: [], pagosAmpa: [], ingresos: [], exencionesPrevias: [],
  };
  const nid = (k) => (d.seq[k] = (d.seq[k] || 0) + 1);
  CURSOS_INI.forEach((n, i) => d.cursos.push({ id: nid('curso'), nombre: n, orden: i + 1 }));
  ASIG_INI.forEach((n) => d.asignaturas.push({ id: nid('asig'), nombre: n }));
  const cid = (n) => d.cursos.find((c) => c.nombre === n).id, aid = (n) => d.asignaturas.find((a) => a.nombre === n).id;
  Object.keys(OFERTA_INI).forEach((c) => OFERTA_INI[c].forEach((a) => d.oferta.push([aid(a), cid(c)])));
  GRUPOS_INI.forEach(([a, c, t, f]) => d.grupos.push({ id: nid('grupo'), asigId: aid(a), cursoId: cid(c), tipo: t, franja: f, activo: true }));
  d.seq.franja = 6;
  TRIM_INI.forEach(([n, i, f]) => d.trimestres.push({ id: nid('trim'), nombre: n, inicio: i, fin: f }));
  return d;
}

let db = seedData();
let _saveHook = null;
function commit() { if (_saveHook) _saveHook(); }
function nextId(kind) { db.seq[kind] = (db.seq[kind] || 0) + 1; return db.seq[kind]; }
function setData(obj) {
  if (!obj || typeof obj !== 'object' || !Array.isArray(obj.grupos) || !Array.isArray(obj.partes)) throw new Error('El archivo no parece de Control de clases.');
  const base = seedData();
  db = Object.assign({}, base, obj);
  db.ajustes = Object.assign({}, base.ajustes, obj.ajustes || {});
  db.seq = obj.seq || {};
}

/* ---------- utilidades ---------- */
const round2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
const eur = (n) => (n == null || isNaN(n) ? '' : round2(n).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €');
const pad = (n) => String(n).padStart(2, '0');
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function fmtFecha(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; }
function fmtCorta(iso) { const [, m, d] = iso.split('-'); return `${d}/${m}`; }
function isoValida(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s || '') && !isNaN(new Date(s + 'T00:00:00')); }
function diaSemana(iso) { return ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'][new Date(iso + 'T00:00:00').getDay()]; }
const byId = (list, id) => list.find((x) => x.id === id);
const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const cursoNombre = (id) => (byId(db.cursos, id) || {}).nombre || '—';
const asigNombre = (id) => (byId(db.asignaturas, id) || {}).nombre || '—';
const alumnoNombre = (id) => (byId(db.alumnos, id) || {}).nombre || '?';
function grupoNombre(g) { return typeof g === 'number' ? grupoNombre(byId(db.grupos, g) || { asigId: 0, cursoId: 0, tipo: '?' }) : `${asigNombre(g.asigId)} ${cursoNombre(g.cursoId)} (${g.tipo})`; }
const grupoById = (id) => byId(db.grupos, id);
function trimestreDe(fecha) { return db.trimestres.find((t) => fecha >= t.inicio && fecha <= t.fin) || null; }
function parteTrimId(p) { if (p.trimestreForzado) return p.trimestreForzado; const t = trimestreDe(p.fecha); return t ? t.id : null; }
const trimNombre = (id) => (byId(db.trimestres, id) || {}).nombre || '—';
function enOferta(asigId, cursoId) { return db.oferta.some(([a, c]) => a === asigId && c === cursoId); }
function inscritoEn(alumnoId, grupoId, fecha) {
  return db.inscripciones.some((i) => i.alumnoId === alumnoId && i.grupoId === grupoId && i.alta <= fecha && (!i.baja || fecha < i.baja));
}
function alumnosDeGrupo(grupoId, fecha) {
  const seen = new Set();
  db.inscripciones.forEach((i) => { if (i.grupoId === grupoId && i.alta <= fecha && (!i.baja || fecha < i.baja)) seen.add(i.alumnoId); });
  return [...seen].map((id) => byId(db.alumnos, id)).filter(Boolean).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
}
function gruposDeFranja(franja) { return db.grupos.filter((g) => g.franja === franja && g.activo); }

/* ---------- persistencia (navegador) ---------- */
const LS_KEY = 'control_clases_datos_v1';
const dataJSON = () => JSON.stringify(db);

'use strict';
/* ===== CALCULOS (sin DOM) ===== */

/* Importe por alumno de un grupo en un parte. filas: [{cobrar:boolean}] */
function calcImportes(tipo, duracion, filas) {
  const a = db.ajustes;
  if (tipo === 'AMPA') return filas.map((f) => (f.cobrar ? round2(a.precioAlumnoAmpa * duracion) : 0));
  const n = filas.filter((f) => f.cobrar).length;
  const precio = n === 1 ? a.privIndividual : a.privGrupo;
  return filas.map((f) => (f.cobrar ? round2(precio * duracion) : 0));
}
function cobrarPorDefecto(tipo, estado) { return tipo === 'AMPA' ? true : estado !== 'aviso'; }

/* Un parte guardado: { id, fecha, duracion, ampa:boolean, tarifaAmpa, trimestreForzado?, clases:[{grupoId,tipo,franja}], asist:[{alumnoId,grupoId,estado,noCobrar,importe}] } */
function horasAmpa(p) { return p.ampa ? p.duracion : 0; }
function importeAmpa(p) { return p.ampa ? round2(p.tarifaAmpa * p.duracion) : 0; }

function partesOrdenados() {
  return db.partes.slice().sort((a, b) => (a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : b.id - a.id));
}
function parteDuplicado(fecha, grupoId, exceptoId) {
  return db.partes.find((p) => p.id !== exceptoId && p.fecha === fecha && p.clases.some((c) => c.grupoId === grupoId)) || null;
}

/* ---------- Cuentas con el AMPA ---------- */
function cuentaAmpa() {
  let horas = 0, total = 0;
  db.partes.forEach((p) => { horas += horasAmpa(p); total += importeAmpa(p); });
  const pagadoYo = db.pagosAmpa.filter((x) => x.pagadoA === 'Yo').reduce((s, x) => s + x.importe, 0);
  const ingresos = db.ingresos.filter((x) => x.pagador === 'AMPA').reduce((s, x) => s + x.importe, 0);
  return { horas, total: round2(total), pagadoYo: round2(pagadoYo), ingresos: round2(ingresos), pendiente: round2(total - pagadoYo - ingresos) };
}

/* ---------- Clases privadas por alumno ---------- */
function cuentasPrivados() {
  const porAlumno = new Map();
  db.partes.forEach((p) => p.asist.forEach((a) => {
    const g = grupoById(a.grupoId);
    if (!g || g.tipo !== 'Privado') return;
    if (!porAlumno.has(a.alumnoId)) porAlumno.set(a.alumnoId, []);
    porAlumno.get(a.alumnoId).push({ fecha: p.fecha, importe: a.importe, id: p.id, grupoId: a.grupoId, estado: a.estado });
  }));
  db.ingresos.forEach((i) => { if (i.pagador !== 'AMPA' && !porAlumno.has(i.pagador)) porAlumno.set(i.pagador, []); });
  const res = [];
  porAlumno.forEach((clases, alumnoId) => {
    const cobrables = clases.filter((c) => c.importe > 0).sort((a, b) => (a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : a.id - b.id));
    const total = round2(cobrables.reduce((s, c) => s + c.importe, 0));
    const ingresos = round2(db.ingresos.filter((i) => i.pagador === alumnoId).reduce((s, i) => s + i.importe, 0));
    let acum = 0, pagadas = 0;
    const detalle = cobrables.map((c) => { acum += c.importe; const pagada = acum <= ingresos + 0.001; if (pagada) pagadas++; return { fecha: c.fecha, concepto: grupoNombre(c.grupoId) + (c.estado === 'asistio' ? '' : ' (falta ' + (c.estado === 'aviso' ? 'con aviso' : 'sin aviso') + ')'), importe: c.importe, pagada }; });
    res.push({ alumnoId, nombre: alumnoNombre(alumnoId), clases: cobrables.length, pagadas, pendientes: cobrables.length - pagadas, total, ingresos, pendiente: round2(total - ingresos), detalle });
  });
  return res.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
}

/* ---------- Tabla de deudas por pagador (AMPA + alumnos de privadas) ---------- */
function deudasPagadores() {
  const a = cuentaAmpa();
  const pagado = a.pagadoYo + a.ingresos;
  const cl = db.partes.filter((p) => p.ampa && importeAmpa(p) > 0).sort((x, y) => (x.fecha < y.fecha ? -1 : x.fecha > y.fecha ? 1 : x.id - y.id));
  let acum = 0, pagadas = 0;
  const detalle = cl.map((p) => { acum += importeAmpa(p); const pagada = acum <= pagado + 0.001; if (pagada) pagadas++; return { fecha: p.fecha, concepto: p.clases.filter((c) => c.tipo === 'AMPA').map((c) => grupoNombre(c.grupoId)).join(' + ') + ' · ' + String(p.duracion).replace('.', ',') + ' h', importe: importeAmpa(p), pagada }; });
  const filaAmpa = { esAmpa: true, nombre: 'AMPA', clases: cl.length, pagadas, pendientes: cl.length - pagadas, total: a.total, ingresos: round2(pagado), pendiente: a.pendiente, detalle };
  return [filaAmpa, ...cuentasPrivados()];
}

/* ---------- Cobros de alumnos del AMPA por trimestre ---------- */
function cobrosAmpa(trimId) {
  const t = byId(db.trimestres, trimId);
  if (!t) return [];
  const claves = new Map();
  const add = (alumnoId, grupoId) => { const k = alumnoId + '|' + grupoId; if (!claves.has(k)) claves.set(k, { alumnoId, grupoId }); };
  db.inscripciones.forEach((i) => {
    const g = grupoById(i.grupoId);
    if (g && g.tipo === 'AMPA' && i.alta <= t.fin && (!i.baja || i.baja > t.inicio)) add(i.alumnoId, i.grupoId);
  });
  db.partes.forEach((p) => { if (parteTrimId(p) === trimId) p.asist.forEach((a) => { const g = grupoById(a.grupoId); if (g && g.tipo === 'AMPA') add(a.alumnoId, a.grupoId); }); });
  const filas = [...claves.values()].map((k) => {
    let clases = 0, importe = 0;
    db.partes.forEach((p) => { if (parteTrimId(p) !== trimId) return; p.asist.forEach((a) => { if (a.alumnoId === k.alumnoId && a.grupoId === k.grupoId && a.importe > 0) { clases++; importe += a.importe; } }); });
    /* Clases anteriores a su alta dentro del trimestre: se cobran salvo exención expresa */
    const altas = db.inscripciones.filter((i) => i.alumnoId === k.alumnoId && i.grupoId === k.grupoId && i.alta <= t.fin && (!i.baja || i.baja > t.inicio)).map((i) => i.alta);
    const alta = altas.length ? altas.sort()[0] : null;
    let previas = 0, previasImporte = 0;
    if (alta && alta > t.inicio) {
      db.partes.forEach((p) => {
        if (parteTrimId(p) !== trimId || p.fecha >= alta || p.fecha < t.inicio) return;
        if (!p.clases.some((c) => c.grupoId === k.grupoId)) return;
        if (p.asist.some((a) => a.alumnoId === k.alumnoId && a.grupoId === k.grupoId)) return;
        previas++; previasImporte += round2(db.ajustes.precioAlumnoAmpa * p.duracion);
      });
    }
    const exenta = db.exencionesPrevias.some((x) => x.trimestreId === trimId && x.alumnoId === k.alumnoId && x.grupoId === k.grupoId);
    if (!exenta) { clases += previas; importe += previasImporte; }
    importe = round2(importe);
    const pago = db.pagosAmpa.find((x) => x.trimestreId === trimId && x.alumnoId === k.alumnoId && x.grupoId === k.grupoId) || null;
    return { alumnoId: k.alumnoId, grupoId: k.grupoId, alumno: alumnoNombre(k.alumnoId), grupo: grupoNombre(k.grupoId), clases, importe, pago, pendiente: pago ? 0 : importe, previas, exenta };
  });
  return filas.sort((a, b) => a.grupo.localeCompare(b.grupo, 'es') || a.alumno.localeCompare(b.alumno, 'es'));
}

/* ---------- Matriz de asistencia ---------- */
function asistenciaMatriz(f) {
  const gruposF = db.grupos.filter((g) => (!f.asigId || g.asigId === f.asigId) && (!f.cursoId || g.cursoId === f.cursoId) && (!f.tipo || g.tipo === f.tipo));
  const ids = new Set(gruposF.map((g) => g.id));
  const trim = f.trimId ? byId(db.trimestres, f.trimId) : null;
  const claseSet = new Set(), asist = new Map(), fechas = new Set(), alumnosPorGrupo = new Map();
  const addAl = (gid, aid) => { if (!alumnosPorGrupo.has(gid)) alumnosPorGrupo.set(gid, new Set()); alumnosPorGrupo.get(gid).add(aid); };
  db.partes.forEach((p) => {
    if (f.trimId && parteTrimId(p) !== f.trimId) return;
    p.clases.forEach((c) => { if (ids.has(c.grupoId)) { claseSet.add(c.grupoId + '|' + p.fecha); fechas.add(p.fecha); } });
    p.asist.forEach((a) => { if (ids.has(a.grupoId)) { asist.set(a.alumnoId + '|' + a.grupoId + '|' + p.fecha, a); addAl(a.grupoId, a.alumnoId); } });
  });
  db.inscripciones.forEach((i) => {
    if (!ids.has(i.grupoId)) return;
    if (!trim || (i.alta <= trim.fin && (!i.baja || i.baja > trim.inicio))) addAl(i.grupoId, i.alumnoId);
  });
  const cols = [...fechas].sort();
  const grupos = [];
  gruposF.forEach((g) => {
    const als = [...(alumnosPorGrupo.get(g.id) || [])].map((id) => byId(db.alumnos, id)).filter(Boolean).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    const clases = {};
    cols.forEach((d) => { if (claseSet.has(g.id + '|' + d)) clases[d] = true; });
    if (!als.length && !Object.keys(clases).length) return;
    const filas = als.map((al) => {
      let nA = 0, nAv = 0, nS = 0;
      const celdas = cols.map((d) => {
        if (!clases[d]) return { vacio: true };
        const a = asist.get(al.id + '|' + g.id + '|' + d);
        if (!a) return { gris: true };
        if (a.estado === 'asistio') nA++; else if (a.estado === 'aviso') nAv++; else nS++;
        return { sim: SIMB[a.estado], estado: a.estado, noCobrar: !!a.noCobrar || a.importe === 0 };
      });
      return { alumno: al, celdas, nA, nAv, nS };
    });
    grupos.push({ grupo: g, nombre: grupoNombre(g), clases, filas });
  });
  grupos.sort((a, b) => cursoOrden(a.grupo.cursoId) - cursoOrden(b.grupo.cursoId) || a.nombre.localeCompare(b.nombre, 'es'));
  return { fechas: cols, grupos };
}
function cursoOrden(id) { return (byId(db.cursos, id) || { orden: 99 }).orden; }

/* combo con autocompletado (sin tildes). items: () => [{id,label}] */
function combo(opt) {
  const input = h('input', { type: 'text', placeholder: opt.placeholder || '', autocomplete: 'off', style: opt.width ? 'width:' + opt.width : '' });
  const list = h('div', { class: 'list', style: 'display:none' });
  const box = h('div', { class: 'combo' }, input, list);
  let sel = null, hi = -1, shown = [];
  const abrir = () => {
    const q = norm(input.value);
    shown = opt.items().filter((i) => !q || norm(i.label).includes(q)).slice(0, 60);
    vaciar(list);
    shown.forEach((i, ix) => list.append(h('div', { class: ix === hi ? 'hi' : '', onmousedown: (e) => { e.preventDefault(); elegir(i); } }, i.label)));
    if (!shown.length) list.append(h('div', { class: 'muted' }, 'Sin coincidencias'));
    list.style.display = '';
  };
  const cerrar = () => { list.style.display = 'none'; hi = -1; };
  const elegir = (i) => { sel = i; input.value = i.label; cerrar(); if (opt.onSelect) opt.onSelect(i); };
  input.addEventListener('input', () => { sel = null; hi = -1; abrir(); if (opt.onInput) opt.onInput(input.value); });
  input.addEventListener('focus', abrir);
  input.addEventListener('blur', () => { setTimeout(cerrar, 120); const exact = opt.items().find((i) => norm(i.label) === norm(input.value)); if (exact && !sel) elegir(exact); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { hi = Math.min(shown.length - 1, hi + 1); abrir(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { hi = Math.max(0, hi - 1); abrir(); e.preventDefault(); }
    else if (e.key === 'Enter') { if (shown[Math.max(hi, 0)] && list.style.display !== 'none') { elegir(shown[Math.max(hi, 0)]); e.preventDefault(); } }
    else if (e.key === 'Escape') cerrar();

  box.text = () => input.value;
  box.set = (i) => { sel = i; input.value = i ? i.label : ''; };
  box.clear = () => box.set(null);
  box.input = input;

}

async function driveCrear(txt) {
  const b = 'ccbound' + Date.now();
  const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: DRIVE_FILE, mimeType: 'application/json' })}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${txt}\r\n--${b}--`;
  return (await dfetch(`${UP}?uploadType=multipart&fields=id,modifiedTime`, { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body })).json();
}
const driveLeer = async (id) => (await dfetch(`${API}/${id}?alt=media`)).text();
const driveMeta = async (id) => (await dfetch(`${API}/${id}?fields=modifiedTime`)).json();
const driveEscribir = async (id, txt) => (await (await dfetch(`${UP}/${id}?uploadType=media&fields=modifiedTime`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: txt })).json());

function driveFalloSesion(e) {
  if (e.message === 'sesion') { DRV.estado = 'caducado'; DRV.error = ''; }
  else { DRV.estado = 'error'; DRV.error = e.message; }
}
/* Guarda el JSON en Drive. Llamado desde guardarAhora. */
async function driveGuardar(txt) {
  if (!DRV.fileId || ['nuevo', 'caducado', 'conflicto'].includes(DRV.estado)) return;
  try {
    const m = await driveMeta(DRV.fileId);
    if (DRV.modified && m.modifiedTime !== DRV.modified) { DRV.estado = 'conflicto'; pintarEstado(); return driveConflicto(); }
    const r = await driveEscribir(DRV.fileId, txt);
    DRV.modified = r.modifiedTime; DRV.estado = 'ok'; DRV.error = ''; DRV.ultimo = new Date(); lsSet('cc_dirty', null);
  } catch (e) { driveFalloSesion(e); }
}
async function driveConflicto() {
  if (DRV.ocupado) return; DRV.ocupado = true;
  try {
    const op = await dialogo('El archivo de Drive ha cambiado', 'Desde que lo abriste, el archivo de Drive se ha modificado (por ejemplo desde otro dispositivo). Elige qué versión te quedas:', [
      { txt: 'Quedarme con la de Drive', val: 'drive' }, { txt: 'Sobrescribir Drive con la mía', val: 'mia', cls: 'primary' }, { txt: 'Descargar la mía y decidir luego', val: 'copia' }]);
    if (op === 'copia') { copiaManual(); return; }
    const m = await driveMeta(DRV.fileId);
    if (op === 'drive') { setData(JSON.parse(await driveLeer(DRV.fileId))); try { localStorage.setItem(LS_KEY, dataJSON()); } catch (e) { /* */ } DRV.modified = m.modifiedTime; DRV.estado = 'ok'; lsSet('cc_dirty', null); render(); toast('Cargada la versión de Drive.', 'ok'); }
    else if (op === 'mia') { DRV.modified = m.modifiedTime; DRV.estado = 'ok'; await driveGuardar(dataJSON()); toast('Drive actualizado con tus datos.', 'ok'); }
  } catch (e) { driveFalloSesion(e); toast('No se pudo: ' + e.message, 'err'); }
  finally { DRV.ocupado = false; pintarEstado(); }
}
/* Botón «Conectar con Google Drive» / «Reconectar» (hay gesto del usuario) */
async function driveConectar() {
  try {
    await pedirToken(false);
    if (lsGet('cc_drive_on') === '1') { await driveEntrar(); render(); pintarEstado(); return; }
    const f = await driveBuscar();
    const hayLocal = db.partes.length || db.alumnos.length;
    if (f) {
      if (hayLocal && !(await confirmar('Datos en Drive', 'En tu Drive ya hay un archivo de datos. Se cargará y se descartará lo que hay ahora en este navegador. ¿Continuar?', 'Cargar de Drive'))) { DRV.estado = DRV.fileId ? 'ok' : 'nuevo'; pintarEstado(); return; }
      setData(JSON.parse(await driveLeer(f.id))); DRV.fileId = f.id; DRV.modified = (await driveMeta(f.id)).modifiedTime;
      try { localStorage.setItem(LS_KEY, dataJSON()); } catch (e) { /* */ }
      render(); toast('Datos cargados desde Drive.', 'ok');
    } else {
      const c = await driveCrear(dataJSON()); DRV.fileId = c.id; DRV.modified = c.modifiedTime; toast('Archivo creado en tu Drive. Se guarda solo.', 'ok');
    }
    lsSet('cc_drive_on', '1'); lsSet('cc_dirty', null); DRV.estado = 'ok'; DRV.ultimo = new Date();
  } catch (e) { toast('No se pudo conectar con Drive: ' + e.message, 'err'); }
  pintarEstado();
}
/* Ya conectado antes (token nuevo): trae la versión de Drive sin preguntar, salvo que haya cambios sin subir */
async function driveEntrar() {
  const f = await driveBuscar();
  if (!f) { DRV.estado = 'nuevo'; return; }
  DRV.fileId = f.id;
  const m = await driveMeta(f.id);
  if (lsGet('cc_dirty') === '1') { DRV.modified = m.modifiedTime; DRV.estado = 'conflicto'; setTimeout(driveConflicto, 300); return; }
  setData(JSON.parse(await driveLeer(f.id))); DRV.modified = m.modifiedTime;
  try { localStorage.setItem(LS_KEY, dataJSON()); } catch (e) { /* */ }
  DRV.estado = 'ok'; DRV.ultimo = new Date();
}
/* Arranque: si ya estuvo conectado, intenta entrar sin molestar; si no, deja el botón. */
async function driveArrancar() {
  if (!driveOK()) return;
  if (lsGet('cc_drive_on') !== '1') { DRV.estado = 'nuevo'; return; }
  DRV.estado = 'caducado';
  try { await pedirToken(true); await driveEntrar(); } catch (e) { DRV.estado = 'caducado'; }
}
function driveConfigurarId() {
  const inp = h('input', { type: 'text', value: lsGet('cc_client_id') || '', placeholder: '123456-abc.apps.googleusercontent.com', style: 'width:100%' });
  dialogo('ID de cliente de Google', h('div', null, h('p', { class: 'small muted' }, 'Solo hace falta si esta versión no lo trae ya incluido.'), inp), [{ txt: 'Cancelar', val: null }, { txt: 'Guardar y recargar', val: () => { lsSet('cc_client_id', inp.value.trim() || null); location.reload(); return true; }, cls: 'primary' }]);
}

'use strict';
/* ===== PANTALLA: PARTE DE CLASE ===== */
const P = { fecha: todayISO(), duracion: 1, sel: [], anuladas: new Set(), filas: new Map(), editId: null, pag: 0, busca: '' };
let pBloques = null, pCab = null, pLista = null, pGrupos = null;

function pReset(mantenerFecha) {
  P.sel = []; P.anuladas = new Set(); P.filas = new Map(); P.editId = null; P.duracion = 1;
  if (!mantenerFecha) P.fecha = todayISO();
}
const pKey = (a, g) => a + '|' + g;
/* Alumno en 2 grupos AMPA del mismo parte: solo se cobra en el primero (se puede cambiar a mano con «Cobrar») */
function pEsSecundaria(f) {
  const g = grupoById(f.grupoId); if (!g || g.tipo !== 'AMPA') return false;
  for (const gid of P.sel) {
    if (P.anuladas.has(gid)) continue;
    if (gid === f.grupoId) return false;
    if (P.filas.has(pKey(f.alumnoId, gid))) return true;
  }
  return false;
}
const pCobrarEf = (f) => (f.manual ? f.cobrar : f.cobrar && !pEsSecundaria(f));
function pSincronizar() {
  // quita filas de grupos no seleccionados y añade los alumnos inscritos en la fecha
  const gs = new Set(P.sel);
  [...P.filas.keys()].forEach((k) => { if (!gs.has(Number(k.split('|')[1]))) P.filas.delete(k); });
  P.sel.forEach((gid) => {
    const g = grupoById(gid); if (!g || !isoValida(P.fecha)) return;
    alumnosDeGrupo(gid, P.fecha).forEach((al) => {
      const k = pKey(al.id, gid);
      if (!P.filas.has(k)) P.filas.set(k, { alumnoId: al.id, grupoId: gid, estado: 'asistio', cobrar: true, manual: false });
    });
  });
}
function pFilasDe(gid) {
  return [...P.filas.values()].filter((f) => f.grupoId === gid).sort((a, b) => alumnoNombre(a.alumnoId).localeCompare(alumnoNombre(b.alumnoId), 'es'));
}
function pSeleccionarFranja(gid) {
  const g = grupoById(gid);
  P.sel = gruposDeFranja(g.franja).filter((x) => x.tipo === g.tipo).map((x) => x.id);
  if (!P.sel.includes(gid)) P.sel.push(gid);
  P.anuladas = new Set(); pSincronizar(); pPintar();
}
function pAlternar(gid, on) {
  const g = grupoById(gid);
  if (on) {
    const otro = P.sel.map(grupoById).find((x) => x && x.tipo !== g.tipo);
    if (otro) { toast('Los grupos AMPA y los privados no se juntan en un mismo parte.', 'err'); pPintar(); return; }
    if (!P.sel.includes(gid)) P.sel.push(gid);
  } else { P.sel = P.sel.filter((x) => x !== gid); P.anuladas.delete(gid); }
  pSincronizar(); pPintar();
}

/* ---------- guardar ---------- */
async function pGuardar() {
  if (!isoValida(P.fecha)) return toast('La fecha no es válida.', 'err');
  if (!(P.duracion > 0)) return toast('La duración debe ser mayor que 0.', 'err');
  if (!P.sel.length) return toast('Pincha primero un grupo de la lista.', 'err');
  const gids = P.sel.filter((g) => !P.anuladas.has(g));
  if (!gids.length) return toast('Todas las clases están anuladas: no hay nada que guardar.', 'err');
  for (const gid of gids) {
    const dup = parteDuplicado(P.fecha, gid, P.editId);
    if (dup) return avisar('Parte ya guardado', `Ya hay un parte de ${grupoNombre(gid)} el ${fmtFecha(P.fecha)}. Ábrelo en la lista de «Partes guardados» para editarlo o borrarlo.`);
  }
  let forzado = null;
  if (!trimestreDe(P.fecha)) {
    if (!db.trimestres.length) return toast('Crea un trimestre en Gestión › Ajustes.', 'err');
    const s = h('select', null, db.trimestres.map((t) => h('option', { value: t.id }, `${t.nombre} (${fmtFecha(t.inicio)} – ${fmtFecha(t.fin)})`)));
    const r = await dialogo('Fecha fuera de trimestre', h('div', null, h('p', null, `El ${fmtFecha(P.fecha)} no está dentro de ningún trimestre. ¿A cuál lo asigno?`), s),
      [{ txt: 'Cancelar', val: null }, { txt: 'Asignar y guardar', val: () => Number(s.value), cls: 'primary' }]);
    if (!r) return; forzado = r;
  }
  const viejo = P.editId ? byId(db.partes, P.editId) : null;
  const parte = { id: P.editId || nextId('parte'), fecha: P.fecha, duracion: P.duracion, ampa: false, tarifaAmpa: viejo && viejo.tarifaAmpa ? viejo.tarifaAmpa : db.ajustes.tarifaAmpa, clases: [], asist: [] };
  if (forzado) parte.trimestreForzado = forzado; else if (viejo && viejo.trimestreForzado && !trimestreDe(P.fecha)) parte.trimestreForzado = viejo.trimestreForzado;
  gids.forEach((gid) => {
    const g = grupoById(gid); const filas = pFilasDe(gid);
    parte.clases.push({ grupoId: gid, tipo: g.tipo, franja: g.franja });
    if (g.tipo === 'AMPA') parte.ampa = true;
    const imps = calcImportes(g.tipo, P.duracion, filas.map((f) => ({ cobrar: pCobrarEf(f) })));
    filas.forEach((f, i) => parte.asist.push({ alumnoId: f.alumnoId, grupoId: gid, estado: f.estado, noCobrar: !pCobrarEf(f), importe: imps[i] }));
  });
  if (P.editId) db.partes[db.partes.findIndex((p) => p.id === P.editId)] = parte; else db.partes.push(parte);
  commit();
  const n = parte.asist.length;
  toast(`Parte guardado: ${parte.clases.length} grupo(s), ${n} alumno(s).`, 'ok');
  pReset(true); pPintar();
}
async function pBorrar() {
  if (!P.editId) return;
  if (!(await confirmar('Borrar parte', `¿Borrar el parte del ${fmtFecha(P.fecha)}? Se eliminan sus clases y asistencias.`, 'Borrar', true))) return;
  db.partes = db.partes.filter((p) => p.id !== P.editId); commit(); toast('Parte borrado.', 'ok'); pReset(true); pPintar();
}
function pAbrir(id) {
  const p = byId(db.partes, id); if (!p) return;
  pReset(true); P.editId = id; P.fecha = p.fecha; P.duracion = p.duracion; P.sel = p.clases.map((c) => c.grupoId);
  p.asist.forEach((a) => P.filas.set(pKey(a.alumnoId, a.grupoId), { alumnoId: a.alumnoId, grupoId: a.grupoId, estado: a.estado, cobrar: !a.noCobrar, manual: true }));
  pSincronizar(); pPintar();
}
function pVecino(delta) {
  const lista = partesOrdenados(); const i = lista.findIndex((p) => p.id === P.editId); const n = lista[i + delta]; if (n) pAbrir(n.id);
}

/* ---------- pintar ---------- */
function pPintarCab() {
  vaciar(pCab);
  const fi = h('input', { type: 'date', value: P.fecha, onchange: () => { if (isoValida(fi.value)) { P.fecha = fi.value; pSincronizar(); pPintar(); } } });
  const du = h('input', { type: 'number', step: '0.25', min: '0.25', value: P.duracion, onchange: () => { P.duracion = Number(du.value) || 0; pPintarBloques(); } });
  pCab.append(...[
    P.editId ? h('div', { class: 'banner', style: 'margin:-14px -16px 12px;border-radius:10px 10px 0 0' }, `✎ Editando el parte del ${fmtFecha(P.fecha)}`,
      h('button', { class: 'btn sm', onclick: () => pVecino(1) }, '◀ anterior'), h('button', { class: 'btn sm', onclick: () => pVecino(-1) }, 'siguiente ▶'),
      h('button', { class: 'btn sm danger', onclick: pBorrar }, 'Borrar este parte'), h('button', { class: 'btn sm', onclick: () => { pReset(true); pPintar(); } }, 'Cancelar edición')) : null,
    h('div', { class: 'row' },
      h('div', { class: 'col' }, h('label', { class: 'lbl' }, 'Fecha ' + (isoValida(P.fecha) ? '(' + diaSemana(P.fecha) + ')' : '')), fi),
      h('div', { class: 'col' }, h('label', { class: 'lbl' }, 'Duración (h)'), du),

}
function pPintarBloques() {
  vaciar(pBloques);
  if (!P.sel.length) { pBloques.append(h('div', { class: 'empty card' }, 'Pincha un grupo de la lista de la izquierda: saldrán sus alumnos y los de los grupos que dan clase a la misma hora.')); return; }

  if (hayAmpa) pBloques.append(h('div', { class: 'small muted', style: 'margin-bottom:8px' }, `Para el AMPA este parte cuenta como ${P.duracion} hora(s): ${eur(db.ajustes.tarifaAmpa * P.duracion)} (una sola vez aunque haya varios grupos).`));
  P.sel.forEach((gid) => {

    const anul = P.anuladas.has(gid), filas = pFilasDe(gid), imps = calcImportes(g.tipo, P.duracion, filas.map((f) => ({ cobrar: pCobrarEf(f) })));

      const fila = h('div', { class: 'alu' });
      fila.append(h('div', { class: 'bold' }, alumnoNombre(f.alumnoId)),
        seg([{ val: 'asistio', txt: '✓ Asistió', cls: 'asistio' }, { val: 'aviso', txt: 'Falta con aviso', cls: 'aviso' }, { val: 'sin', txt: 'Falta sin aviso', cls: 'sin' }], f.estado,
          (v) => { f.estado = v; if (!f.manual) f.cobrar = cobrarPorDefecto(g.tipo, v); pPintarBloques(); }),
        h('div', { class: 'row', style: 'gap:10px;align-items:center;flex-wrap:nowrap' }, checkbox('Cobrar', pCobrarEf(f), (v) => { f.cobrar = v; f.manual = true; pPintarBloques(); }), h('span', { class: 'imp' }, eur(imps[i]))));

      if (anul) fila.style.pointerEvents = 'none';

}
function pPintarGrupos() {

  });
  if (!todos.length) box.append(h('div', { class: 'empty small' }, 'Aún no hay partes guardados.'));
  pLista.append(box, h('div', { class: 'row', style: 'justify-content:space-between;margin-top:8px' },
    h('button', { class: 'btn sm', disabled: P.pag <= 0, onclick: () => { P.pag--; pPintarLista(); } }, '◀ más recientes'),
    h('span', { class: 'small muted' }, `${P.pag + 1}/${pags}`),
    h('button', { class: 'btn sm', disabled: P.pag >= pags - 1, onclick: () => { P.pag++; pPintarLista(); } }, 'más antiguos ▶')));

function pPintar() { pPintarCab(); pPintarGrupos(); pPintarBloques(); pPintarLista(); }

    F('[Content_Types].xml', X + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' + hojas.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') + '</Types>'),
    F('_rels/.rels', X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'),
    F('xl/workbook.xml', X + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' + hojas.map((s, i) => `<sheet name="${xe(s.nombre)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets></workbook>'),
    F('xl/_rels/workbook.xml.rels', X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + hojas.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') + `<Relationship Id="rId${hojas.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`),
    F('xl/styles.xml', X + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="10"/><name val="Arial"/></font><font><b/><sz val="10"/><name val="Arial"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>'),
    ...hojas.map((s, i) => F(`xl/worksheets/sheet${i + 1}.xml`, hojaXml(s.rows, s.w))),
  ];
  descargar(`control_clases_${todayISO()}.xlsx`, zipStore(files)); toast('Excel exportado.', 'ok');
}

'use strict';
/* ===== ARRANQUE Y NAVEGACION ===== */
const TABS = [['parte', 'Parte'], ['asistencia', 'Asistencia'], ['cobros', 'Cobros AMPA'], ['cuentas', 'Cuentas'], ['gestion', 'Gestión']];
let vistaActual = 'parte';
function ir(v) { vistaActual = v; render(); }
function render() {
  const nav = vaciar($('#tabs'));
  TABS.forEach(([k, t]) => nav.append(h('button', { class: k === vistaActual ? 'on' : '', onclick: () => ir(k) }, t)));
  const root = vaciar($('#vista'));
  const v = VIEWS[vistaActual];
  try { if (v) v.render(root); else root.append(h('div', { class: 'empty' }, 'Pantalla no disponible')); }
  catch (e) { root.append(h('div', { class: 'card' }, h('b', null, 'Error al mostrar la pantalla: '), String(e && e.stack || e))); console.error(e); }
}
window.addEventListener('error', (e) => toast('Error: ' + e.message, 'err'));
window.addEventListener('DOMContentLoaded', async () => {
  await iniciarPersistencia();
  render();
});
</script>
